/* ============================= SUPABASE DATA LAYER ============================= */

async function loadData(){
  if(!currentUser) return;
  try{
    const [recipesRes, logsRes] = await Promise.all([
      sb.from('sourdough_recipes')
        .select('id,title,category,hydration,sourceName:source_name,sourceUrl:source_url,ingredients,steps,notes,photo:photo_url')
        .order('title'),
      sb.from('sourdough_logs')
        .select('id,date:log_date,title,recipeId:recipe_id,symptoms,description,myCauseNotes:my_cause_notes,suggestedCauses:suggested_causes,plannedChange:planned_change,photo:photo_url,followUps:sourdough_followups(id,date:followup_date,result,notes,photo:photo_url)')
        .order('log_date', { ascending:false })
    ]);
    if(recipesRes.error) throw recipesRes.error;
    if(logsRes.error) throw logsRes.error;
    const recipes = recipesRes.data || [];
    const logs = logsRes.data || [];
    logs.forEach(l => {
      l.recipeName = l.recipeId ? ((recipes.find(r=>r.id===l.recipeId)||{}).title || null) : null;
      if(l.followUps) l.followUps.sort((a,b)=> (a.date||'').localeCompare(b.date||''));
    });
    state.recipes = recipes;
    state.logs = logs;
  }catch(err){
    console.error(err);
    showToast('⚠️ Could not load your data — check your connection.');
  }
  render();
}

// Converts a data: URL (from the resize/preview step) into a Blob and uploads
// it to the user's folder in Supabase Storage, returning a public URL.
async function uploadPendingPhoto(dataUrl, folder){
  if(!dataUrl) return null;
  if(!dataUrl.startsWith('data:')) return dataUrl; // already a hosted URL — nothing to do
  try{
    const blob = await (await fetch(dataUrl)).blob();
    const path = currentUser.id + '/' + folder + '/' + uid() + '.jpg';
    const { error } = await sb.storage.from(PHOTOS_BUCKET).upload(path, blob, { contentType:'image/jpeg', upsert:true });
    if(error) throw error;
    const { data } = sb.storage.from(PHOTOS_BUCKET).getPublicUrl(path);
    return data.publicUrl;
  }catch(err){
    console.error(err);
    showToast('⚠️ Photo upload failed — saved without it.');
    return null;
  }
}

/* ============================= HELPERS ============================= */

function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function escapeHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nl2br(s){ return escapeHtml(s).replace(/\n/g,'<br>'); }

function amazonSearchUrl(term){
  return 'https://www.amazon.com/s?k=' + encodeURIComponent(term);
}

function entryStatus(entry){
  if(!entry.followUps || entry.followUps.length===0) return 'awaiting';
  const last = entry.followUps[entry.followUps.length-1];
  if(last.result === 'solved') return 'resolved';
  return 'progress';
}
function statusLabel(s){
  return s==='awaiting' ? 'Awaiting change' : s==='progress' ? 'In progress' : 'Resolved';
}

function showToast(msg){
  const root = document.getElementById('toastRoot');
  root.innerHTML = '<div class="toast">'+escapeHtml(msg)+'</div>';
  setTimeout(()=>{ root.innerHTML=''; }, 2400);
}

function resizeImage(file, callback){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxW = 800;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderAuthScreen(){
  const isSignup = authMode === 'signup';
  return `

        <div class="field">

          <input type="text" id="authEmail" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="authPassword" placeholder="${isSignup ? 'At least 6 characters' : 'Your password'}" autocomplete="${isSignup?'new-password':'current-password'}" minlength="6" required>
        </div>
        <div id="authMsg"></div>
        <button type="submit" class="btn block">${isSignup ? 'Create account' : 'Sign in'}</button>
      </form>
      <div style="text-align:center;margin-top:14px;font-size:13.5px;">
        ${isSignup
          ? 'Already have an account? <button type="button" class="link-btn" onclick="switchAuthMode(\'signin\')">Sign in</button>'
          : 'New here? <button type="button" class="link-btn" onclick="switchAuthMode(\'signup\')">Create an account</button>'}
      </div>
      ${!isSignup ? '<div style="text-align:center;margin-top:8px;"><button type="button" class="link-btn" onclick="handleForgotPassword()">Forgot password?</button></div>' : ''}
    </div>
  `;
}

function switchAuthMode(mode){
  authMode = mode;
  render();
}

async function handleAuthSubmit(e){
  e.preventDefault();
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const btn = e.target.querySelector('button[type=submit]');
  const msgEl = document.getElementById('authMsg');
  msgEl.innerHTML = '';
  if(btn){ btn.disabled = true; btn.textContent = 'Please wait…'; }
  try{
    if(authMode === 'signup'){
      const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: window.location.href } });
      if(error) throw error;
      if(data.session){
        currentSession = data.session;
        currentUser = data.user;
        await loadData();
      } else {
        authMode = 'signin';
        render();
        document.getElementById('authMsg').innerHTML = '<p style="color:var(--good);font-size:13.5px;margin-top:8px;">Account created — check your email to confirm it, then sign in here.</p>';
      }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
      currentSession = data.session;
      currentUser = data.user;
      await loadData();
    }
  }catch(err){
    msgEl.innerHTML = '<p style="color:var(--danger);font-size:13.5px;margin-top:8px;">'+escapeHtml(err.message || 'Something went wrong.')+'</p>';
    if(btn){ btn.disabled = false; btn.textContent = authMode==='signup' ? 'Create account' : 'Sign in'; }
  }
}

async function handleForgotPassword(){
  const email = (document.getElementById('authEmail').value || '').trim();
  if(!email){ alert('Enter your email above first, then tap "Forgot password?" again.'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
  if(error){ alert('Could not send reset email: '+error.message); return; }
  alert('Password reset email sent to '+email+'.');
}

async function handleSignOut(){
  closeModal();
  await sb.auth.signOut();
}

async function initAuth(){
  const { data: { session } } = await sb.auth.getSession();
  currentSession = session;
  currentUser = session ? session.user : null;
  if(currentUser){ await loadData(); } else { render(); }

  sb.auth.onAuthStateChange((event, newSession) => {
    const wasSignedIn = !!currentUser;
    currentSession = newSession;
    currentUser = newSession ? newSession.user : null;
    if(currentUser && !wasSignedIn){
      loadData();
    } else if(!currentUser && wasSignedIn){
      state = { recipes:[], logs:[] };
      currentView = 'home';
      render();
    }
  });
}

/* ============================= RENDER ROOT ============================= */

function render(){
  const app = document.getElementById('app');
  if(!currentUser){
    app.innerHTML = renderAuthScreen();
    document.getElementById('bottomNav').innerHTML = '';

  }
  if(currentView==='home') app.innerHTML = renderHome();
  else if(currentView==='mybakes') app.innerHTML = renderMyBakes();
  else if(currentView==='entryDetail') app.innerHTML = renderEntryDetail();
  else if(currentView==='newEntry') app.innerHTML = renderNewEntry();
  else if(currentView==='recipes') app.innerHTML = renderRecipes();
  else if(currentView==='recipeForm') app.innerHTML = renderRecipeForm();
  else if(currentView==='guide') app.innerHTML = renderGuide();
  else if(currentView==='start') app.innerHTML = renderStart();
  renderNav();
}

  document.getElementById('symptomChecks').outerHTML = renderSymptomChecks();
  document.getElementById('suggestedCausesPreview').innerHTML = renderSuggestedCausesPreview();

function renderSymptomChecks(){
  return '<div class="checkbox-grid" id="symptomChecks">' +
    SYMPTOM_LIBRARY.map(s => (
      '<button type="button" class="chip-check '+(selectedSymptoms.includes(s.id)?'checked':'')+'" onclick="toggleSymptom(\''+s.id+'\')">'+escapeHtml(s.symptom)+'</button>'
    )).join('') +

function renderSuggestedCausesPreview(){
  const causes = [];
  selectedSymptoms.forEach(id=>{

  if(!causes.length) return '<p class="hint" style="color:var(--muted);">Select a symptom above to see likely causes.</p>';
  return '<ul style="margin:0 0 0 18px;padding:0;">' + causes.map(c=>'<li style="font-size:14px;margin-bottom:4px;">'+escapeHtml(c)+'</li>').join('') + '</ul>';

async function submitEntry(e){
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  const recipeId = document.getElementById('entryRecipe').value || null;
  const causes = [];
  selectedSymptoms.forEach(id=>{
    const lib = SYMPTOM_LIBRARY.find(s=>s.id===id);
    if(lib) lib.causes.forEach(c=>{ if(!causes.includes(c)) causes.push(c); });
  });
  const photoUrl = await uploadPendingPhoto(pendingPhoto, 'logs');
  const { data, error } = await sb.from('sourdough_logs').insert({
    user_id: currentUser.id,
    log_date: document.getElementById('entryDate').value || todayStr(),
    title: document.getElementById('entryTitle').value.trim(),
    recipe_id: recipeId,
    symptoms: [...selectedSymptoms],
    description: document.getElementById('entryDescription').value.trim(),
    my_cause_notes: document.getElementById('entryCauseNotes').value.trim(),
    suggested_causes: causes,
    planned_change: document.getElementById('entryPlannedChange').value.trim(),
    photo_url: photoUrl
  }).select('id').single();
  if(error){
    showToast('⚠️ Could not save: '+error.message);
    if(btn){ btn.disabled = false; btn.textContent = 'Save bake log'; }
    return;
  }
  showToast('Bake logged 🍞');
  await loadData();
  currentEntryId = data.id;
  currentView = 'entryDetail';
  render();
  window.scrollTo(0,0);
}

            </div>
          </div>
          ${r.photo ? '<img class="thumb" src="'+r.photo+'">' : ''}
        </div>
      </div>
    `).join('') : `
      <div class="card empty-state">
        <div class="big">📖</div>
        <p>${all.length ? 'No recipes in this view.' : 'No recipes saved yet. Store the ones you bake — or clip one from a website — so you can link them to future bake logs.'}</p>
        ${all.length ? '' : `
          <div class="quick-actions" style="justify-content:center;">
            <button class="btn" onclick="startNewRecipe()">Add your first recipe</button>
            <button class="btn secondary" onclick="openSaveFromWebModal()">Save one from the web</button>
          </div>
        `}
      </div>
    `}
  `;
}
function setRecipeFilter(f){
  recipeFilter = f;
  document.getElementById('app').innerHTML = renderRecipes();
}

function openRecipe(id){
  currentRecipeId = id;
  const r = state.recipes.find(x=>x.id===id);
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <button class="modal-close" onclick="closeModal()">✕</button>
        ${r.sourceUrl ? '<div class="web-badge">🌐 '+escapeHtml(r.sourceName || 'Saved from web')+'</div>' : ''}
        <h2>${escapeHtml(r.title)}</h2>
        <div class="recipe-meta">
          ${r.category ? '<span>'+escapeHtml(r.category)+'</span>' : ''}
          ${r.hydration ? '<span>'+escapeHtml(r.hydration)+'% hydration</span>' : ''}
        </div>
        ${r.sourceUrl ? '<a class="source-link" href="'+escapeHtml(r.sourceUrl)+'" target="_blank" rel="noopener">🔗 View original recipe'+(r.sourceName? ' on '+escapeHtml(r.sourceName):'')+'</a>' : ''}
        ${r.photo ? '<img class="photo-preview" src="'+r.photo+'">' : ''}
        ${r.ingredients && r.ingredients.length ? `
          <div class="divider"></div>
          <h4>Ingredients</h4>
          <ul style="margin:0 0 0 18px;padding:0;">
            ${r.ingredients.map(ing=>'<li>'+escapeHtml(ing.amount)+' '+escapeHtml(ing.name)+'</li>').join('')}
          </ul>
        ` : ''}
        ${r.steps && r.steps.length ? `
          <div class="divider"></div>
          <h4>Steps</h4>
          ${r.steps.map((s,i)=>'<div class="step"><div class="step-num">'+(i+1)+'</div><div class="step-body">'+nl2br(s)+'</div></div>').join('')}
        ` : ''}
        ${r.notes ? `<div class="divider"></div><h4>Notes</h4><p>${nl2br(r.notes)}</p>` : ''}
        <div class="quick-actions" style="margin-top:14px;">
          <button class="btn secondary" onclick="closeModal(); editRecipe('${r.id}')">Edit</button>
          <button class="btn danger" onclick="deleteRecipe('${r.id}')">Delete</button>
        </div>
      </div>
    </div>
  `;
}

async function deleteRecipe(id){
  if(!confirm('Delete this recipe?')) return;
  const { error } = await sb.from('sourdough_recipes').delete().eq('id', id);
  if(error){ showToast('⚠️ Could not delete: '+error.message); return; }
  closeModal();
  showToast('Recipe deleted');
  await loadData();
  goTo('recipes');
}

function startNewRecipe(){
  currentRecipeId = null;
  pendingRecipePhoto = null;
  recipeIngredientRows = [{name:'',amount:''}];
  recipeStepRows = [''];
  currentView = 'recipeForm';
  render();
  window.scrollTo(0,0);
}
function editRecipe(id){
  const r = state.recipes.find(x=>x.id===id);
  if(!r) return;
  currentRecipeId = id;
  pendingRecipePhoto = r.photo || null;
  recipeIngredientRows = r.ingredients && r.ingredients.length ? r.ingredients.map(i=>({...i})) : [{name:'',amount:''}];
  recipeStepRows = r.steps && r.steps.length ? [...r.steps] : [''];
  currentView = 'recipeForm';
  render();
  window.scrollTo(0,0);
}

function addIngredientRow(){
  recipeIngredientRows.push({name:'',amount:''});
  document.getElementById('ingredientRows').outerHTML = renderIngredientRows();
}
function removeIngredientRow(i){
  recipeIngredientRows.splice(i,1);
  if(!recipeIngredientRows.length) recipeIngredientRows.push({name:'',amount:''});
  document.getElementById('ingredientRows').outerHTML = renderIngredientRows();
}
function updateIngredientRow(i, field, val){ recipeIngredientRows[i][field] = val; }

function addStepRow(){
  recipeStepRows.push('');
  document.getElementById('stepRows').outerHTML = renderStepRows();
}
function removeStepRow(i){
  recipeStepRows.splice(i,1);
  if(!recipeStepRows.length) recipeStepRows.push('');
  document.getElementById('stepRows').outerHTML = renderStepRows();
}
function updateStepRow(i, val){ recipeStepRows[i] = val; }

function renderIngredientRows(){
  return '<div id="ingredientRows">' + recipeIngredientRows.map((row,i)=>`
    <div class="ingredient-row">
      <input type="text" placeholder="Amount (e.g. 500g)" value="${escapeHtml(row.amount)}" oninput="updateIngredientRow(${i},'amount',this.value)">
      <input type="text" placeholder="Ingredient" value="${escapeHtml(row.name)}" oninput="updateIngredientRow(${i},'name',this.value)">
      <button type="button" class="remove-row" onclick="removeIngredientRow(${i})">✕</button>
    </div>
  `).join('') + '<button type="button" class="btn secondary small" onclick="addIngredientRow()">+ Add ingredient</button></div>';
}
function renderStepRows(){
  return '<div id="stepRows">' + recipeStepRows.map((s,i)=>`
    <div class="step-row">
      <div class="step-num">${i+1}</div>
      <textarea placeholder="Describe this step" oninput="updateStepRow(${i},this.value)">${escapeHtml(s)}</textarea>
      <button type="button" class="remove-row" onclick="removeStepRow(${i})">✕</button>
    </div>
  `).join('') + '<button type="button" class="btn secondary small" onclick="addStepRow()">+ Add step</button></div>';
}

function handleRecipePhoto(e){
  const file = e.target.files[0];
  if(!file) return;
  resizeImage(file, dataUrl=>{
    pendingRecipePhoto = dataUrl;
    const img = document.getElementById('recipePhotoPreview');
    img.src = dataUrl; img.style.display='block';
  });
}

function renderRecipeForm(){
  const r = currentRecipeId ? state.recipes.find(x=>x.id===currentRecipeId) : null;
  return `
    <div class="back-row"><button class="btn secondary small" onclick="goTo('recipes')">← Cancel</button></div>
    <div class="card">
      <h2>${r ? 'Edit recipe' : 'Add recipe'}</h2>
      <form onsubmit="submitRecipe(event)">
        <div class="field">
          <label>Recipe name</label>
          <input type="text" id="recTitle" value="${r?escapeHtml(r.title):''}" placeholder="e.g. Everyday Country Boule" required>
        </div>
        <div class="grid-2">
          <div class="field">
            <label>Category</label>
            <select id="recCategory">
              ${['Boule/Loaf','Batard','Baguette','Focaccia','Rolls','Bagels','Starter/Levain','Other'].map(c=>'<option '+(r&&r.category===c?'selected':'')+'>'+c+'</option>').join('')}
            </select>
          </div>
          <div class="field">
            <label>Hydration %</label>
            <input type="number" id="recHydration" value="${r&&r.hydration?r.hydration:''}" placeholder="e.g. 75">
          </div>
        </div>
        <div class="field">
          <label>Saved from a website? (optional)</label>
          <div class="grid-2">
            <input type="text" id="recSourceName" value="${r&&r.sourceName?escapeHtml(r.sourceName):''}" placeholder="Site name (e.g. King Arthur Baking)">
            <input type="text" id="recSourceUrl" value="${r&&r.sourceUrl?escapeHtml(r.sourceUrl):''}" placeholder="Paste the link here">
          </div>
          <div class="hint">Leave blank for your own recipes.</div>
        </div>
        <div class="field">
          <label>Ingredients</label>
          ${renderIngredientRows()}
        </div>
        <div class="field">
          <label>Steps</label>
          ${renderStepRows()}
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea id="recNotes" placeholder="Timing, tips, variations you like...">${r&&r.notes?escapeHtml(r.notes):''}</textarea>
        </div>
        <div class="field">
          <label>Photo (optional)</label>
          <input type="file" accept="image/*" onchange="handleRecipePhoto(event)">
          <img id="recipePhotoPreview" class="photo-preview" src="${pendingRecipePhoto||''}" style="display:${pendingRecipePhoto?'block':'none'};">
        </div>
        <button type="submit" class="btn block">${r?'Save changes':'Save recipe'}</button>
      </form>
    </div>
  `;
}

async function submitRecipe(e){
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  const ingredients = recipeIngredientRows.filter(row=>row.name.trim()||row.amount.trim());
  const steps = recipeStepRows.map(s=>s.trim()).filter(Boolean);
  const photoUrl = await uploadPendingPhoto(pendingRecipePhoto, 'recipes');
  const payload = {
    title: document.getElementById('recTitle').value.trim(),
    category: document.getElementById('recCategory').value,
    hydration: document.getElementById('recHydration').value.trim(),
    source_name: document.getElementById('recSourceName').value.trim(),
    source_url: document.getElementById('recSourceUrl').value.trim(),
    ingredients,
    steps,
    notes: document.getElementById('recNotes').value.trim(),
    photo_url: photoUrl
  };
  let error;
  if(currentRecipeId){
    ({ error } = await sb.from('sourdough_recipes').update(payload).eq('id', currentRecipeId));
  } else {
    payload.user_id = currentUser.id;
    ({ error } = await sb.from('sourdough_recipes').insert(payload));
  }
  if(error){
    showToast('⚠️ Could not save recipe: '+error.message);
    if(btn){ btn.disabled = false; btn.textContent = currentRecipeId ? 'Save changes' : 'Save recipe'; }
    return;
  }
  showToast('Recipe saved 📖');
  await loadData();
  goTo('recipes');
}

/* ============================= SAVE RECIPE FROM WEB ============================= */

function openSaveFromWebModal(){
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <h2>🌐 Save a recipe from the web</h2>
        <p style="color:var(--muted);">Found something worth trying? Paste the link now and fill in the details whenever you're ready — you can always come back and add ingredients, steps, or a photo later.</p>
        <form onsubmit="submitWebRecipe(event)">
          <div class="field">
            <label>Recipe name</label>
            <input type="text" id="webRecTitle" placeholder="e.g. 75% Hydration Country Loaf" required>
          </div>
          <div class="field">
            <label>Link to the recipe</label>
            <input type="text" id="webRecUrl" placeholder="Paste the URL here" required>
          </div>
          <div class="field">
            <label>Site name (optional)</label>
            <input type="text" id="webRecSourceName" placeholder="e.g. King Arthur Baking, a blog, a YouTube channel...">
          </div>
          <div class="field">
            <label>Quick notes (optional)</label>
            <textarea id="webRecNotes" placeholder="Why you saved it, what looked interesting, substitutions to try..."></textarea>
          </div>
          <button type="submit" class="btn block">Save link</button>
        </form>
      </div>
    </div>
  `;
}

async function submitWebRecipe(e){
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  const { error } = await sb.from('sourdough_recipes').insert({
    user_id: currentUser.id,
    title: document.getElementById('webRecTitle').value.trim(),
    category: 'Other',
    hydration: '',
    source_name: document.getElementById('webRecSourceName').value.trim(),
    source_url: document.getElementById('webRecUrl').value.trim(),
    ingredients: [],
    steps: [],
    notes: document.getElementById('webRecNotes').value.trim(),
    photo_url: null
  });
  if(error){
    showToast('⚠️ Could not save: '+error.message);
    if(btn){ btn.disabled = false; btn.textContent = 'Save link'; }
    return;
  }
  closeModal();
  showToast('Recipe link saved 🌐');
  recipeFilter = 'all';
  await loadData();
  goTo('recipes');
}

/* ============================= TROUBLESHOOTING GUIDE ============================= */

function renderGuide(){
  const q = guideSearch.toLowerCase();
  const items = SYMPTOM_LIBRARY.filter(s => !q || s.symptom.toLowerCase().includes(q) || s.causes.join(' ').toLowerCase().includes(q));
  return `
    <div class="card">
      <h2>Troubleshooting guide</h2>
      <p style="color:var(--muted);">A quick reference for common sourdough problems. Tap "Log this" to start a bake entry pre-filled with that symptom.</p>
      <div class="search-box">
        <input type="text" placeholder="Search symptoms (e.g. gummy, flat, sour)..." value="${escapeHtml(guideSearch)}" oninput="updateGuideSearch(this.value)">
      </div>
      ${items.map(s => `
        <div class="lib-item">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <h4>${escapeHtml(s.symptom)}</h4>
            <button class="link-btn" onclick="startNewEntry('${s.id}')">Log this →</button>
          </div>
          <strong style="font-size:13px;color:var(--muted);">Likely causes</strong>
          <ul>${s.causes.map(c=>'<li>'+escapeHtml(c)+'</li>').join('')}</ul>
          <strong style="font-size:13px;color:var(--muted);">What to try</strong>
          <ul>${s.fixes.map(f=>'<li>'+escapeHtml(f)+'</li>').join('')}</ul>
        </div>
      `).join('') || '<p class="hint">No matches. Try a different search term.</p>'}
    </div>
  `;
}
function updateGuideSearch(v){
  guideSearch = v;
  document.getElementById('app').innerHTML = renderGuide();
  // restore focus to search input
  const input = document.querySelector('.search-box input');
  if(input){ input.focus(); input.setSelectionRange(v.length, v.length); }
}

    <div class="card">
      <h2>Getting started with sourdough</h2>

      </ul>

      </ul>

    <div class="card">
      <h3>Glossary</h3>
      <ul class="tool-list">

/* ============================= SETTINGS / BACKUP ============================= */

function openSettings(){
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <h2>Account &amp; settings</h2>
        <p style="color:var(--muted);">Signed in as <strong>${escapeHtml(currentUser ? currentUser.email : '')}</strong>. Your bakes and recipes sync automatically to every device you sign into.</p>
        <button class="btn secondary block" onclick="handleSignOut()">Sign out</button>
        <div class="divider"></div>
        <div class="quick-actions">
          <button class="btn" onclick="exportData()">⬇️ Export backup (.json)</button>
          <button class="btn secondary" onclick="document.getElementById('importFile').click()">⬆️ Import backup</button>
        </div>
        <input type="file" id="importFile" accept="application/json" style="display:none;" onchange="importData(event)">
        <div class="hint">Import adds recipes/bakes from an old backup into your account — it won't overwrite what's already here. Embedded photos from very old local backups aren't carried over.</div>
        <div class="divider"></div>
        <p style="font-size:13px;color:var(--muted);">Tip on your phone: open this page in Safari or Chrome, then use "Add to Home Screen" for a full-screen app icon.</p>
        <div class="divider"></div>
        <button class="btn danger block" onclick="clearAllData()">Erase all my data</button>
      </div>
    </div>
  `;
}
function exportData(){
  const payload = { recipes: state.recipes, logs: state.logs, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sourdough-companion-backup-'+todayStr()+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(evt){
    try{
      const data = JSON.parse(evt.target.result);
      if(!data.recipes || !data.logs) throw new Error('bad format');
      if(!confirm('This will add '+data.recipes.length+' recipe(s) and '+data.logs.length+' bake log(s) from the backup into your account. Continue?')) return;
      showToast('Importing…');
      const recipeIdMap = {};
      for(const r of data.recipes){
        const { data: inserted, error } = await sb.from('sourdough_recipes').insert({
          user_id: currentUser.id,
          title: r.title, category: r.category || null, hydration: r.hydration || null,
          source_name: r.sourceName || null, source_url: r.sourceUrl || null,
          ingredients: r.ingredients || [], steps: r.steps || [], notes: r.notes || null,
          photo_url: (r.photo && r.photo.startsWith('http')) ? r.photo : null
        }).select('id').single();
        if(!error && inserted) recipeIdMap[r.id] = inserted.id;
      }
      for(const l of data.logs){
        const { data: insertedLog, error } = await sb.from('sourdough_logs').insert({
          user_id: currentUser.id,
          log_date: l.date || todayStr(), title: l.title || null,
          recipe_id: l.recipeId ? (recipeIdMap[l.recipeId] || null) : null,
          symptoms: l.symptoms || [], description: l.description || null,
          my_cause_notes: l.myCauseNotes || null, suggested_causes: l.suggestedCauses || [],
          planned_change: l.plannedChange || null,
          photo_url: (l.photo && l.photo.startsWith('http')) ? l.photo : null
        }).select('id').single();
        if(!error && insertedLog && l.followUps && l.followUps.length){
          for(const fu of l.followUps){
            await sb.from('sourdough_followups').insert({
              user_id: currentUser.id, log_id: insertedLog.id,
              followup_date: fu.date || todayStr(), result: fu.result || 'same',
              notes: fu.notes || null,
              photo_url: (fu.photo && fu.photo.startsWith('http')) ? fu.photo : null
            });
          }
        }
      }
      closeModal();
      await loadData();
      goTo('home');
      showToast('Backup imported ✅');
    }catch(err){
      console.error(err);
      alert('That file doesn\'t look like a valid backup.');
    }
  };
  reader.readAsText(file);
}
async function clearAllData(){
  if(!confirm('This permanently erases every bake and recipe in your account. Export a backup first if you want to keep it. Continue?')) return;
  await sb.from('sourdough_logs').delete().eq('user_id', currentUser.id);
  await sb.from('sourdough_recipes').delete().eq('user_id', currentUser.id);
  closeModal();
  await loadData();
  goTo('home');
  showToast('All data erased');
}

/* ============================= INIT ============================= */

initAuth();

// Register service worker for offline support + installability.
// Silently no-ops if unsupported (e.g. opened directly as a local file).
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* not hosted over http(s) — fine, app still works */ });
  });
}
